<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiClaro Maps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Roboto, sans-serif; background: #FDFDFF; }
    #app { min-height: 100vh; }

    /* Global CSS compilado desde app.acss */
    

    /* CSS de páginas compilado desde .acss */
    
    /* Estilos base para componentes Claro */
    [data-component="modal"] {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: flex-end;
      justify-content: center; z-index: 100;
    }
    [data-component="modal"] > div {
      background: white; border-radius: 20px 20px 0 0;
      padding: 24px; width: 100%; max-width: 480px;
    }
    [data-component="loader"] {
      display: flex; align-items: center;
      justify-content: center; min-height: 200px;
    }
    [data-component="claro-button"] {
      display: block; width: 100%; padding: 14px;
      border: none; border-radius: 25px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; margin-bottom: 8px;
    }
    [data-component="claro-button"][type="primary"] {
      background: #DA291C; color: white;
    }
    [data-component="claro-button"][type="secondary"] {
      background: transparent; color: #DA291C;
      border: 1.5px solid #DA291C;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Templates de páginas compilados desde .axml -->
  <script type="text/template" id="__page_template__">
    
<!-- Página: main/ui/pages/loading-page/loading-page -->
<div data-component="modal" data-if="{{ !loader }}" atts={{ modal }} onCloseModal={{ onCloseModal }}>
  <div data-component="view" data-if="{{ modalTextSlot }}" slot="modal-content-text">
    <span data-component="text" data-if="{{ modal.title }}" class="custom-error-title-modal">
      {{ modal.title }}
    </span>
    <span data-component="text" class="custom-error-text-modal {{httpError ? 'font-size-14' : 'font-size-16'}}">
      {{ modal.text }}
    </span>
  </div>
  <div data-component="view" data-if="{{ modalButtonSlot }}" slot="modal-actions" class="modal-button-slot">
    <div data-component="claro-button" size="sm" type="primary" data-ontap=" onCloseModal " text={{ modal.textButton }} className="modal-button-roboto-medium" />
    <div data-component="claro-button" size="sm" type="secondary" data-ontap="exitMiniprogram" text="En otro momento" className="modal-button-roboto-medium" />
  </div>
</div>

<iframe data-component="web-view" data-if="{{ render }}" data-src="https://maps.google.com/maps?q={{latitude}},{{longitude}}&z=15&output=embed" />
<div data-component="loader" show={{ loader }} />

  </script>

												})
												this.errorPopup()
											}
										}
									})
								}
							}
						})
						this.setData({
							isFirstTime: true
						})
					}
					if (authCounter === 4) {
						this.setData({
							authCounter: 0
						})
						my.showAuthGuide({
							authType: "LBS",
							success: ({ shown }) => {
								if (!shown) {
									my.showAuthGuide({
										authType: "LBSSERVICE",
										success: ({ shown }) => {
											if (!shown) {
												this.setData({
													isShown: false
												})
												this.errorPopup()
											}
										}
									})
								}
							}
						})
						setTimeout(() => {
							this.iosGetLocation()
						}, 4000)
						return
					}
					this.setData({
						authCounter: authCounter + 1
					})
					setTimeout(() => {
						this.iosGetLocation()
					}, 4000)
					return
				}

				if (error >= 12 && error <= 14) {
					if (errorCounter === 7) {
						this.errorPopup()
						return
					}
					this.setData({
						errorCounter: errorCounter + 1
					})

					setTimeout(() => {
						this.iosGetLocation()
					}, 2000)
					return
				}

				if (error === 2001 || error === 18) {
					this.errorPopup()
					return
				}

				// ios flow is not showing error 2002 or 2003 when user click remember my choice
				if (error === 2002 || error === 2003) {
					this.setData({
						rememberChoiceError: true
					})
					this.openSetting()
					return
				}
				this.errorPopup()
			}
		})
	},
	async validateFirebase() {
		if (this.data.firstTimeFirebase) {
			let confirmTag = "sa_bt_pa_au_sipermitir"
			let tagflujo = "flujo_puntosatencion_sa"

			if (this.data.isGuestModeUser) {
				confirmTag = "sa_zi_bt_pa_au_sipermitir"
				tagflujo = "flujo_home_sa_zi"
			}
			callAppsFlyer(confirmTag)
			callFirebase(tagflujo, confirmTag)
			this.setData({
				firstTimeFirebase: false
			})
		}
	},
	// validate if location is enabled
	async isLocationEnabled() {
		const systemInfo = await my.getSystemInfo()
		return !!(systemInfo.locationEnabled && systemInfo.locationAuthorized)
	},
	// exit to miniprogram
	exitMiniprogram() {
		my.exitMiniProgram()
	},
	// error popup configs
	errorPopup() {
		this.setData({
			loader: false,
			httpError: true,
			modalTextSlot: true,
			modalButtonSlot: false,
			modal: {
				show: true,
				icon: "error",
				title: "Inténtalo más tarde",
				text: "Algo salió mal al procesar tu solicitud",
				textButton: "Aceptar"
			},
			onCloseModal: "exitMiniprogram"
		})
	},
	// alert popup configs
	alertPopup() {
		const { platform } = this.data
		this.setData({
			loader: false,
			httpError: false,
			modalTextSlot: false,
			modalButtonSlot: true,
			modal: {
				show: true,
				icon: "info",
				title: "",
				text: "Queremos conocer tu ubicación\\n para mejorar tu experiencia",
				textButton: "Sí, permitir"
			},
			onCloseModal: platform === "android" ? "androidGetLocation" : "iosGetLocation"
		})
	},
	// reset popup configs
	resetPopup() {
		this.setData({
			httpError: false,
			modalButtonSlot: false,
			modalTextSlot: false,
			loader: true,
			modal: {
				...this.data.modal,
				show: false
			},
			onCloseModal: ""
		})
	},
	// open settings when already user decline miniprogram permission
	openSetting() {
		this.setData({
			rememberChoiceError: true
		})
		this.resetPopup()
		my.openSetting()
	}
    });
  }
}

    document.addEventListener('DOMContentLoaded', function() {
      var attempts = 0;
      var interval = setInterval(function() {
        attempts++;
        if (window.SuperApp && window.SuperApp.getOpenUserInfo) {
          clearInterval(interval);
          // El window.my ya fue reemplazado por el SDK real
          SuperAppRuntime.render(document.getElementById('app'));
        } else if (attempts > 50) {
          clearInterval(interval);
          SuperAppRuntime.render(document.getElementById('app'));
        }
      }, 100);
    });
